<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d4d4d4" stop-opacity="0.85"/>
    </linearGradient>
    <!-- 7-day rainbow stripe -->
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"    stop-color="#b91c1c"/>
      <stop offset="14.3%" stop-color="#b91c1c"/>
      <stop offset="14.3%" stop-color="#c2410c"/>
      <stop offset="28.6%" stop-color="#c2410c"/>
      <stop offset="28.6%" stop-color="#0369a1"/>
      <stop offset="42.9%" stop-color="#0369a1"/>
      <stop offset="42.9%" stop-color="#7c3aed"/>
      <stop offset="57.1%" stop-color="#7c3aed"/>
      <stop offset="57.1%" stop-color="#db2777"/>
      <stop offset="71.4%" stop-color="#db2777"/>
      <stop offset="71.4%" stop-color="#0d9488"/>
      <stop offset="85.7%" stop-color="#0d9488"/>
      <stop offset="85.7%" stop-color="#ca8a04"/>
      <stop offset="100%"  stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="92" ry="92" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Bold geometric "N" letterform -->
  <path d="
    M 136 390
    L 136 122
    L 188 122
    L 324 326
    L 324 122
    L 376 122
    L 376 390
    L 324 390
    L 188 186
    L 188 390
    Z
  " fill="url(#accent)"/>

  <!-- 7-day rainbow bar at bottom -->
  <rect x="136" y="410" width="240" height="6" rx="3" fill="url(#rainbow)" opacity="0.7"/>
</svg>
